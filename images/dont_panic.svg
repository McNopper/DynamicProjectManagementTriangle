<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Don't Panic badge">
  <defs>
    <radialGradient id="badgeFill" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="92%" stop-color="#78350f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#badgeFill)" stroke="#78350f" stroke-width="3"/>
  <circle cx="100" cy="100" r="94" fill="url(#rim)"/>
  <ellipse cx="78" cy="62" rx="40" ry="18" fill="#ffffff" opacity="0.18"/>
  <text x="100" y="92" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="34" font-weight="900" fill="#15803d" letter-spacing="1">DON'T</text>
  <text x="100" y="138" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="34" font-weight="900" fill="#15803d" letter-spacing="1">PANIC</text>
</svg>
